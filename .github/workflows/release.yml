name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    phar:
        name: Build PHAR
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  coverage: none
                  tools: composer, box:4.6.6

            - run: composer install --no-progress --prefer-dist
            - run: vendor/bin/tester tests -s -C
            - run: ./build-phar.sh

            # manual run only checks the build, a release is created from a tag
            - if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: deployment.phar
                  path: deployment.phar

            - if: startsWith(github.ref, 'refs/tags/')
              run: gh release create "$GITHUB_REF_NAME" deployment.phar --title "$GITHUB_REF_NAME" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}