# Test FTP and SFTP servers for manual/integration testing of deployments, see readme.md
name: ftp-deployment-test

services:
  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "deploy|deploy|/home/deploy|1000"
    # own config: foreground vsftpd (the image's default start has a pidproxy race), chroot like real hostings;
    # copied because vsftpd refuses a config file not owned by root
    command: sh -c "install -m 644 /servers/vsftpd.conf /etc/vsftpd/vsftpd.conf && exec vsftpd /etc/vsftpd/vsftpd.conf"
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21100-21109:21100-21109"
    volumes:
      - ./data/ftp:/home/deploy
      # whole directory: a single-file bind mount goes stale when git recreates the file on a branch switch
      - .:/servers:ro

  ftps:
    build: ./ftps
    # ss -K in ftps-drop.sh resets connections
    cap_add: [NET_ADMIN]
    environment:
      USERS: "deploy|deploy|/home/deploy|1000"
    command: sh -c "install -m 644 /servers/vsftpd-ftps.conf /etc/vsftpd/vsftpd.conf && exec vsftpd /etc/vsftpd/vsftpd.conf"
    ports:
      - "127.0.0.1:2990:21"
      - "127.0.0.1:21110-21119:21110-21119"
    volumes:
      - ./data/ftps:/home/deploy
      - .:/servers:ro

  sftp:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: 1000
      PGID: 1000
      USER_NAME: deploy
      USER_PASSWORD: deploy
      PASSWORD_ACCESS: "true"
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - ./data/sftp:/config/www

  sftp-restricted:
    build: ./sftp-restricted
    ports:
      - "127.0.0.1:2223:22"
    volumes:
      - ./data/sftp-restricted:/home/deploy/www
